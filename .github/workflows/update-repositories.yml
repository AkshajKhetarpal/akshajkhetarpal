name: Update Repository Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repository-cards
  cancel-in-progress: true

jobs:
  update-repositories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update repository section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          username = "akshajkhetarpal"
          profile_repo = username.lower()

          api_url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated&direction=desc"
          )

          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          repos = [
              repo
              for repo in repos
              if not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() != profile_repo
          ]

          sections = []

          for repo in repos:
              name = repo["name"]
              description = repo.get("description") or "No description provided."
              language = repo.get("language") or "Various"
              stars = repo.get("stargazers_count", 0)
              forks = repo.get("forks_count", 0)
              url = repo["html_url"]

              description = " ".join(description.split())

              if len(description) > 180:
                  description = description[:177] + "..."

              sections.append(
                  f"""### [{name}]({url})

          {description}

          `{language}` · ⭐ {stars} · 🍴 {forks}"""
              )

          if sections:
              generated = "\n\n---\n\n".join(sections)
          else:
              generated = "_No public repositories yet._"

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          start_marker = "<!-- REPOSITORIES:START -->"
          end_marker = "<!-- REPOSITORIES:END -->"

          if start_marker not in readme or end_marker not in readme:
              raise RuntimeError(
                  "README.md is missing the repository markers."
              )

          start_index = readme.index(start_marker)
          end_index = readme.index(end_marker) + len(end_marker)

          replacement = (
              start_marker
              + "\n\n"
              + generated
              + "\n\n"
              + end_marker
          )

          updated_readme = (
              readme[:start_index]
              + replacement
              + readme[end_index:]
          )

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated_readme)
          PY

      - name: Commit generated changes
        run: |
          git add README.md

          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi

          git commit -m "Update public repositories"

      - name: Push changes safely
        run: |
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Fetching latest main before retry..."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          import os
          import urllib.request

          username = "akshajkhetarpal"
          profile_repo = username.lower()

          api_url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated&direction=desc"
          )

          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          repos = [
              repo
              for repo in repos
              if not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() != profile_repo
          ]

          sections = []

          for repo in repos:
              name = repo["name"]
              description = repo.get("description") or "No description provided."
              language = repo.get("language") or "Various"
              stars = repo.get("stargazers_count", 0)
              forks = repo.get("forks_count", 0)
              url = repo["html_url"]

              description = " ".join(description.split())

              if len(description) > 180:
                  description = description[:177] + "..."

              sections.append(
                  f"""### [{name}]({url})

          {description}

          `{language}` · ⭐ {stars} · 🍴 {forks}"""
              )

          generated = (
              "\n\n---\n\n".join(sections)
              if sections
              else "_No public repositories yet._"
          )

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          start_marker = "<!-- REPOSITORIES:START -->"
          end_marker = "<!-- REPOSITORIES:END -->"

          start_index = readme.index(start_marker)
          end_index = readme.index(end_marker) + len(end_marker)

          replacement = (
              start_marker
              + "\n\n"
              + generated
              + "\n\n"
              + end_marker
          )

          readme = (
              readme[:start_index]
              + replacement
              + readme[end_index:]
          )

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)
          PY

            git add README.md

            if git diff --cached --quiet; then
              echo "No changes detected after refresh."
              exit 0
            fi

            git commit -m "Update public repositories"

          done

          echo "Unable to push after 3 attempts."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
