name: Update Repository Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repositories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate repository cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          username = "akshajkhetarpal"
          profile_repo = username.lower()

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated&direction=desc"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          repos = [
              repo for repo in repos
              if not repo["fork"]
              and repo["name"].lower() != profile_repo
              and not repo["archived"]
          ]

          cards = []

          for repo in repos:
              name = repo["name"]
              cards.append(
                  f'<a href="https://github.com/{username}/{name}">'
                  f'<img src="https://github-readme-stats.vercel.app/api/pin/?username={username}&repo={name}&theme=github_dark&hide_border=true" width="48%" />'
                  f'</a>'
              )

          generated = "\n\n".join(cards)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- REPOSITORIES:START -->"
          end = "<!-- REPOSITORIES:END -->"

          start_index = readme.index(start)
          end_index = readme.index(end) + len(end)

          replacement = (
              start
              + "\n\n"
              + generated
              + "\n\n"
              + end
          )

          readme = (
              readme[:start_index]
              + replacement
              + readme[end_index:]
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update repository cards"
          git push
