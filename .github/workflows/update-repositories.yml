name: Update Repository Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repositories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate repository list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          username = "akshajkhetarpal"
          profile_repo = username.lower()

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated&direction=desc"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          repos = [
              repo for repo in repos
              if not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() != profile_repo
          ]

          cards = []

          for repo in repos:
              name = repo["name"]
              description = repo.get("description") or "No description provided."
              url = repo["html_url"]

              description = description.replace("\n", " ").strip()

              if len(description) > 180:
                  description = description[:177] + "..."

              language = repo.get("language") or "Various"

              stars = repo.get("stargazers_count", 0)
              forks = repo.get("forks_count", 0)

              card = f"""### [{name}]({url})

          {description}

          ` {language} ` · ⭐ {stars} · 🍴 {forks}

          """

              cards.append(card)

          generated = "\n".join(cards)

          if not generated.strip():
              generated = "_No public repositories yet._"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- REPOSITORIES:START -->"
          end = "<!-- REPOSITORIES:END -->"

          start_index = readme.index(start)
          end_index = readme.index(end) + len(end)

          replacement = (
              start
              + "\n\n"
              + generated
              + "\n"
              + end
          )

          readme = (
              readme[:start_index]
              + replacement
              + readme[end_index:]
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit updated repository section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update public repositories"
            git push
          fi
